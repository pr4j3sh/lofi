<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>lofi audio test page</title>
    <style>
      body { font: 16px system-ui; background: #16131f; color: #e8e3f2; display: grid; place-items: center; min-height: 100vh; margin: 0; }
      main { text-align: center; }
      audio { width: 320px; margin-top: 20px; }
    </style>
  </head>
  <body>
    <main>
      <h1>lofi test tone</h1>
      <p>Local, generated audio. No network requests.</p>
      <audio controls loop></audio>
    </main>
    <script>
      const sampleRate = 44100;
      const seconds = 8;
      const samples = sampleRate * seconds;
      const buffer = new ArrayBuffer(44 + samples * 2);
      const view = new DataView(buffer);
      const write = (offset, text) => {
        for (let i = 0; i < text.length; i += 1) view.setUint8(offset + i, text.charCodeAt(i));
      };
      write(0, 'RIFF');
      view.setUint32(4, 36 + samples * 2, true);
      write(8, 'WAVEfmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      write(36, 'data');
      view.setUint32(40, samples * 2, true);
      for (let i = 0; i < samples; i += 1) {
        const t = i / sampleRate;
        const value = Math.sin(2 * Math.PI * 220 * t) * 0.25 + Math.sin(2 * Math.PI * 330 * t) * 0.15;
        view.setInt16(44 + i * 2, value * 32767, true);
      }
      const audio = document.querySelector('audio');
      audio.src = URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
    </script>
  </body>
</html>
