<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2440" />
      <stop offset="0.55" stop-color="#191625" />
      <stop offset="1" stop-color="#14121b" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1b2d" />
      <stop offset="1" stop-color="#171420" />
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c58a0" />
      <stop offset="1" stop-color="#4b3c73" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eee6ff" />
      <stop offset="1" stop-color="#b9a2ee" />
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)" />
  <circle cx="1200" cy="40" r="210" fill="#6c58a0" opacity="0.14" />
  <circle cx="40" cy="780" r="180" fill="#9a86d4" opacity="0.08" />

  <g transform="translate(110 52)">
    <rect width="1060" height="696" rx="22" fill="url(#card)" stroke="#3a3352" stroke-width="2" />

    <g transform="translate(44 42)">
      <rect width="34" height="34" rx="11" fill="#423668" stroke="#5b4b86" />
      <rect x="10" y="13" width="3.5" height="9" rx="1.75" fill="#d9c9ff" />
      <rect x="15" y="9" width="3.5" height="17" rx="1.75" fill="#d9c9ff" />
      <rect x="20" y="12" width="3.5" height="11" rx="1.75" fill="#d9c9ff" />
      <text x="50" y="27" fill="#eee6ff" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="28" font-weight="700">lofi settings</text>
      <text x="50" y="48" fill="#8c84a3" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13">Make it yours</text>
    </g>

    <g transform="translate(44 116)">
      <rect width="972" height="78" rx="16" fill="#201d2b" stroke="#3b354b" />
      <text x="22" y="31" fill="#ddd4ef" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="600">Automatically enable lofi on supported websites</text>
      <text x="22" y="55" fill="#8c84a3" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13">When access is already granted, lofi turns on as soon as a site loads.</text>
      <rect x="878" y="25" width="60" height="28" rx="14" fill="#9a86d4" />
      <circle cx="921" cy="39" r="11" fill="#ece7f7" />
    </g>

    <g transform="translate(44 222)">
      <text x="0" y="0" fill="#b9a2ee" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="700" letter-spacing="2">DEFAULTS</text>

      <g transform="translate(0 22)">
        <text x="0" y="0" fill="#b9b0ce" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13">Playback speed</text>
        <text x="198" y="0" fill="#ddcffc" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700">0.80x</text>
        <rect x="0" y="14" width="230" height="4" rx="2" fill="#3b354b" />
        <rect x="0" y="14" width="101" height="4" rx="2" fill="#9a86d4" />
        <circle cx="101" cy="16" r="7" fill="#f2ecff" stroke="#7f6cb0" stroke-width="2" />
      </g>

      <g transform="translate(280 22)">
        <text x="0" y="0" fill="#b9b0ce" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13">Reverb intensity</text>
        <text x="198" y="0" fill="#ddcffc" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700">40%</text>
        <rect x="0" y="14" width="230" height="4" rx="2" fill="#3b354b" />
        <rect x="0" y="14" width="92" height="4" rx="2" fill="#9a86d4" />
        <circle cx="92" cy="16" r="7" fill="#f2ecff" stroke="#7f6cb0" stroke-width="2" />
      </g>

      <g transform="translate(560 0)">
        <text x="0" y="0" fill="#b9b0ce" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13">Default preset</text>
        <rect x="0" y="14" width="232" height="38" rx="10" fill="#201d2b" stroke="#3b354b" />
        <text x="14" y="38" fill="#ddd4ef" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13">Slowed + Reverb</text>
        <text x="204" y="38" fill="#8c84a3" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11">▾</text>
      </g>
    </g>

    <g transform="translate(44 332)">
      <text x="0" y="0" fill="#b9a2ee" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="700" letter-spacing="2">SUPPORTED WEBSITES</text>
      <text x="700" y="0" fill="#8c84a3" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12">Enable or disable individual domains</text>

      <g transform="translate(0 20)">
        <rect width="972" height="58" rx="14" fill="#201d2b" stroke="#3b354b" />
        <rect x="16" y="13" width="32" height="32" rx="10" fill="#1db954" opacity="0.18" />
        <circle cx="32" cy="29" r="9" fill="#1db954" />
        <path d="M27 24 Q36 29 27 34 Z" fill="#0d1a12" />
        <text x="64" y="26" fill="#ddd4ef" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600">Spotify</text>
        <text x="64" y="44" fill="#8c84a3" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11">open.spotify.com</text>
        <rect x="878" y="15" width="60" height="28" rx="14" fill="#9a86d4" />
        <circle cx="921" cy="29" r="11" fill="#ece7f7" />
      </g>

      <g transform="translate(0 86)">
        <rect width="972" height="58" rx="14" fill="#201d2b" stroke="#3b354b" />
        <rect x="16" y="13" width="32" height="32" rx="10" fill="#ff6b6b" opacity="0.16" />
        <path d="M25 24 L35 29 L25 34 Z" fill="#ff6b6b" />
        <text x="64" y="26" fill="#ddd4ef" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600">YouTube Music</text>
        <text x="64" y="44" fill="#8c84a3" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11">music.youtube.com</text>
        <rect x="878" y="15" width="60" height="28" rx="14" fill="#9a86d4" />
        <circle cx="921" cy="29" r="11" fill="#ece7f7" />
      </g>

      <g transform="translate(0 152)">
        <rect width="972" height="58" rx="14" fill="#201d2b" stroke="#3b354b" />
        <rect x="16" y="13" width="32" height="32" rx="10" fill="#5b4b86" />
        <text x="23" y="35" fill="#d9c9ff" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="700">M</text>
        <text x="64" y="26" fill="#ddd4ef" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600">My custom site</text>
        <text x="64" y="44" fill="#8c84a3" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11">music.example.com</text>
        <rect x="878" y="15" width="60" height="28" rx="14" fill="#3b354b" />
        <circle cx="895" cy="29" r="11" fill="#8c84a3" />
        <text x="930" y="35" fill="#8c84a3" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="18">×</text>
      </g>

      <g transform="translate(0 226)">
        <rect width="760" height="44" rx="12" fill="#171420" stroke="#3b354b" />
        <text x="16" y="28" fill="#706a80" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13">Add a custom domain, e.g. music.example.com</text>
        <rect x="776" width="196" height="44" rx="12" fill="url(#purple)" stroke="#8d76c4" />
        <text x="838" y="28" fill="#fff" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700">Add website</text>
      </g>
    </g>

    <g transform="translate(44 638)">
      <text x="0" y="0" fill="#8c84a3" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12">Audio never leaves your browser. No analytics, no tracking, no uploads.</text>
    </g>
